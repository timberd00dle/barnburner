<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barnburner">
<meta name="theme-color" content="#F4F1EA">
<title>Barnburner</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EA;--card:#FBF9F4;--ink:#1B1B1B;--sub:#5C5A55;--rule:#D8D2C4;--ctl:#CFC8B8;--acc:#1F5E3B;--accInk:#FFFFFF;--live:#B3261E;--dim:#8B877E;--logo:#A39C8C;--star:#B07D00}
[data-theme=dark]{--bg:#171612;--card:#211F1A;--ink:#EDE9DF;--sub:#A8A398;--rule:#33302A;--ctl:#45413A;--acc:#6FBF8E;--accInk:#0F1A13;--live:#FF6B5E;--dim:#7E796F;--logo:#6B665C;--star:#E8B931}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.cond{font-family:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif}
header.mast{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 0;border-bottom:2px solid var(--ink)}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-size:26px;font-weight:700;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--ctl);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;text-decoration:none}
nav.sections{display:flex;gap:18px;font-size:14px;font-weight:600;margin-bottom:-2px;overflow-x:auto;scrollbar-width:none}
nav.sections::-webkit-scrollbar{display:none}
nav.sections a{min-height:40px;display:flex;align-items:center;text-decoration:none;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
nav.sections a[aria-current=page]{color:var(--ink);border-bottom-color:var(--acc)}
.bar{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.pills{display:flex;align-items:center;gap:4px;font-size:13px;flex-wrap:wrap}
.pills .lbl{color:var(--sub);margin-right:4px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:36px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;border:1px solid var(--ctl);white-space:nowrap;flex:none;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.tabs{display:flex;gap:6px}
.tabs .chip{flex:1;min-height:40px}
.tabs .chip[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1.pg{margin:0;font-size:20px;font-weight:700}
.pghead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pghead .mono{font-size:11px;color:var(--sub)}
.datebtn{flex:1;position:relative;min-height:44px;border:1px solid var(--ctl);background:var(--card);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
main{padding:0 16px 32px}
h2.grp{margin:18px 0 4px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
a.game{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.teams{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.trow{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
.rank{width:18px;flex:none;text-align:right;font-size:11px;color:var(--acc);font-family:'IBM Plex Mono',monospace}
/* logos: square transparent box, nothing clipped; only the text fallback is a circle */
.logo{width:32px;height:32px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:transparent}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.fb{width:28px;height:28px;margin:2px;border-radius:50%;border:1px dashed var(--logo);background:var(--card);color:var(--sub);font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;overflow:hidden}
.logo.sm{width:24px;height:24px}
.logo.sm.fb{width:22px;height:22px;margin:1px;font-size:7px}
.tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.tname small{font-size:11px;color:var(--sub);font-weight:400;margin-left:5px;font-family:'IBM Plex Mono',monospace}
.lost{color:var(--sub)}
.won .tname{font-weight:600}
.score{font-size:16px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.status{width:78px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;border-left:1px solid var(--rule);padding-left:10px;font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;text-align:right}
.status .s2{font-size:11px;color:var(--sub);font-weight:500}
.is-live{color:var(--live)}
.foot{margin:18px 0 0;font-size:11px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;line-height:1.5}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
.err{margin:16px 0;padding:12px;border:1px solid var(--live);border-radius:8px;font-size:14px;line-height:1.5}
.err .chip{margin-top:8px}
.note{font-size:12px;color:var(--sub);line-height:1.5;font-family:'IBM Plex Mono',monospace}
/* data tables built from grid rows */
.g{display:grid;align-items:center;column-gap:6px;border-bottom:1px solid var(--rule);padding:8px 0;font-size:13px;text-decoration:none;color:var(--ink)}
.g.h{border-bottom:1px solid var(--ink);font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--sub);padding:8px 0 4px}
.g .r{text-align:right;font-family:'IBM Plex Mono',monospace}
.g .s{color:var(--sub)}
.g .b{font-weight:600}
.g .tm{display:flex;align-items:center;gap:8px;min-width:0}
.g .tm .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .tm .sub{display:block;font-size:11px;color:var(--sub);font-weight:400}
.g .tag2{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--acc)}
.sortbtn{min-height:32px;padding:0;border:0;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;text-align:right;color:var(--sub)}
.sortbtn[aria-pressed=true]{color:var(--acc);text-decoration:underline;text-underline-offset:3px}
.bubble{display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--live)}
.bubble span{flex:1;border-top:1px dashed var(--live)}
/* game page */
.back{min-height:44px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:15px;font-weight:600;color:var(--ink)}
.ghead{display:flex;flex-direction:column;gap:10px;padding:14px 0 6px}
.gstat{display:flex;justify-content:space-between;font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--sub)}
.big{display:flex;align-items:center;gap:10px;font-size:19px;min-width:0}
.big .logo{width:48px;height:48px}
.big .logo.fb{width:40px;height:40px;margin:4px;font-size:9px}
.big .score{font-size:30px}
.big .tname{font-size:19px;color:inherit;text-decoration:none}
.star{width:40px;height:40px;border:0;background:transparent;color:var(--dim);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.star[aria-pressed=true]{color:var(--star)}
table{border-collapse:collapse}
table.line{width:100%;font-size:13px;font-family:'IBM Plex Mono',monospace;margin-top:6px}
table.line th,table.line td{text-align:center;padding:7px 0;border-bottom:1px solid var(--rule)}
table.line thead th{font-size:11px;color:var(--sub);font-weight:600;border-bottom:1px solid var(--ink)}
table.line th[scope=row]{text-align:left}
section.blk{margin-top:18px}
section.blk h3{margin:0 0 4px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.per{font-size:11px;color:var(--sub);font-weight:600;margin:12px 0 0;text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace}
.goal{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--rule)}
.goal .when{width:44px;flex:none;font-size:11px;font-weight:600;color:var(--sub);line-height:1.45;font-family:'IBM Plex Mono',monospace}
.goal .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.goal .who{font-size:14px;font-weight:600}
.goal .ast{font-size:12px;color:var(--sub)}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--acc);color:var(--accInk);margin-left:6px;vertical-align:1px}
.goal .gs{font-size:15px;font-weight:600;font-family:'IBM Plex Mono',monospace}
.srow{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.srow .lbl{display:flex;justify-content:space-between;font-size:13px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.srow .lbl span:nth-child(2){color:var(--sub);font-size:12px;font-family:'IBM Plex Sans',sans-serif;font-weight:400}
.bars{display:flex;gap:4px;height:5px}
.bars span{display:block;height:5px;border-radius:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.box{width:100%;font-size:12.5px;white-space:nowrap;font-family:'IBM Plex Mono',monospace}
table.box th,table.box td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--rule)}
table.box th:first-child,table.box td:first-child{text-align:left;padding-left:0;position:sticky;left:0;background:var(--bg);font-family:'IBM Plex Sans',sans-serif}
table.box thead th{font-size:10px;color:var(--sub);border-bottom:1px solid var(--ink);font-weight:600}
.play{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:13px;line-height:1.4}
.play .t{width:44px;flex:none;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub);font-weight:600}
.play .x{flex:1;min-width:0}
.play.goalplay .x{font-weight:600}
.play .sc{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sub)}
pre.raw{font-size:11px;white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px;max-height:60vh;overflow:auto}
.src{margin-top:20px;padding-top:10px;border-top:1px solid var(--rule);font-size:11px;color:var(--sub);font-family:'IBM Plex Mono',monospace;line-height:1.5}
.linkbtn{border:0;background:transparent;color:var(--acc);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
/* team page */
.thero{display:flex;gap:14px;align-items:center;padding:14px 0 10px}
.thero .logo{width:60px;height:60px}
.thero .logo.fb{width:56px;height:56px;margin:2px;font-size:12px}
.thero h1{margin:0;font-size:26px;font-weight:700;line-height:1.05}
.thero .sub{font-size:13px;color:var(--sub)}
.rec{width:100%;font-family:'IBM Plex Mono',monospace;font-size:14px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:4px 0 12px}
.rec th{font-size:10px;color:var(--sub);font-weight:600;text-align:left;padding:6px 0 2px}
.rec td{font-weight:600;padding:2px 0 8px}
.outbtn{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--acc);display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;font-size:13px;color:var(--acc)}
.fav{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px;text-decoration:none;color:var(--ink)}
.fav .tname small{display:inline}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <a class="brand cond" href="#/" id="brand">Barnburner</a>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Dark mode" aria-pressed="false"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
    <nav class="sections" aria-label="Sections">
      <a href="#/" data-nav="scores">Scores</a>
      <a href="#/standings" data-nav="standings">Standings</a>
      <a href="#/npi" data-nav="npi">NPI</a>
      <a href="#/stats" data-nav="stats">Stats</a>
      <a href="#/teams" data-nav="teams">Teams</a>
    </nav>
  </header>
  <div id="view"></div>
</div>
<script>
(function () {
  'use strict';

  // ---- settings -------------------------------------------------------
  var CFG = {
    api: '/api',               // data relay (Vercel function)
    sport: 'icehockey-men',
    div: 'd1',
    livePoll: 30000,           // refresh every 30s while any game is live or about to start
    idlePoll: 300000,          // every 5 min on a game day otherwise
    gamePoll: 20000            // box score refresh while live
  };
  var DEMO = /[?&]demo=1/.test(location.search);
  var CONF_ORDER = ['NCHC', 'Big Ten', 'Hockey East', 'ECAC Hockey', 'CCHA', 'Atlantic Hockey America', 'Independent'];
  var CONF_SHORT = { 'NCHC': 'NCHC', 'Big Ten': 'Big Ten', 'Hockey East': 'Hockey East', 'ECAC Hockey': 'ECAC', 'CCHA': 'CCHA', 'Atlantic Hockey America': 'AHA', 'Independent': 'Independent' };

  var view = document.getElementById('view');
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var gameCache = {};
  var timer = null, ageTimer = null, stale = false, current = null;

  // ---- helpers --------------------------------------------------------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return iso(new Date()); }
  function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function prettyDate(s) { return parseISO(s).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); }
  function ordinal(n) { n = +n; return n === 1 ? '1st' : n === 2 ? '2nd' : n === 3 ? '3rd' : n === 4 ? 'OT' : n > 4 ? (n - 3) + 'OT' : ''; }
  function clearTimers() { clearTimeout(timer); clearInterval(ageTimer); timer = null; ageTimer = null; }
  function ago(at) {
    if (!at) return '';
    var s = Math.max(0, Math.round((Date.now() - at.getTime()) / 1000));
    return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago';
  }
  function titleCase(s) { return String(s || '').toLowerCase().replace(/(^|[\s\-'.])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }).replace(/\bMc([a-z])/g, function (m, a) { return 'Mc' + a.toUpperCase(); }); }
  function fmt3(v) { if (v == null || v === '') return ''; var n = +v; return isNaN(n) ? v : (n >= 1 ? n.toFixed(3) : n.toFixed(3).replace(/^0/, '')); }
  function findArray(obj, test, depth) {
    depth = depth || 0;
    if (!obj || typeof obj !== 'object' || depth > 6) return null;
    if (Array.isArray(obj)) {
      if (obj.length && obj.every(test)) return obj;
      for (var i = 0; i < obj.length; i++) { var r = findArray(obj[i], test, depth + 1); if (r) return r; }
      return null;
    }
    for (var k in obj) { var r2 = findArray(obj[k], test, depth + 1); if (r2) return r2; }
    return null;
  }

  // ---- team names: one key per school across every source ---------------
  function normName(s) { return String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, ' ').trim(); }
  var ALIAS = {
    'boston u': 'boston university', 'boston univ': 'boston university', 'bu': 'boston university', 'bc': 'boston college', 'boston col': 'boston college',
    'uconn': 'connecticut', 'umass': 'massachusetts', 'umass amherst': 'massachusetts', 'umass lowell': 'massachusetts lowell', 'mass lowell': 'massachusetts lowell', 'uml': 'massachusetts lowell',
    'rpi': 'rensselaer', 'rensselaer polytechnic institute': 'rensselaer', 'rit': 'rochester institute of technology', 'rochester inst': 'rochester institute of technology',
    'unh': 'new hampshire', 'miami oh': 'miami', 'miami ohio': 'miami', 'st thomas mn': 'st thomas', 'st thomas minn': 'st thomas', 'st thomas minnesota': 'st thomas', 'saint thomas': 'st thomas',
    'alaska fairbanks': 'alaska', 'army west point': 'army', 'u s military academy': 'army', 'us military academy': 'army', 'united states military academy': 'army',
    'u s air force academy': 'air force', 'us air force academy': 'air force', 'united states air force academy': 'air force', 'air force academy': 'air force',
    'liu': 'long island', 'long island university': 'long island', 'nebraska omaha': 'omaha', 'minnesota state mankato': 'minnesota state', 'minnesota st mankato': 'minnesota state', 'minn st mankato': 'minnesota state',
    'augustana sd': 'augustana', 'umd': 'minnesota duluth', 'colorado col': 'colorado college', 'cc': 'colorado college', 'lake superior': 'lake superior state', 'saint lawrence': 'st lawrence',
    'saint cloud state': 'st cloud state', 'union ny': 'union', 'michigan technological': 'michigan tech', 'pennsylvania state': 'penn state', 'bowling green state': 'bowling green',
    'holy cross college': 'holy cross', 'osu': 'ohio state', 'msu': 'michigan state', 'und': 'north dakota', 'wmu': 'western michigan', 'scsu': 'st cloud state', 'asu': 'arizona state'
  };
  var KEEP_COLLEGE = { 'boston college': 1, 'colorado college': 1 };
  function canon(s) {
    var n = normName(s).replace(/^the /, '');
    if (ALIAS[n]) return ALIAS[n];
    n = n.replace(/^university of /, '').replace(/ university of /, ' ');
    if (n !== 'boston university') n = n.replace(/ university( |$)/, '$1').trim();
    n = n.replace(/^college of (the )?/, '');
    if (!KEEP_COLLEGE[n]) n = n.replace(/ college$/, '');
    n = n.replace(/ st$/, ' state').replace(/ mich$/, ' michigan').replace(/^minn /, 'minnesota ').replace(/^mich /, 'michigan ');
    return ALIAS[n] || n;
  }
  // 2026-27 membership (backup when the feed doesn't say)
  var CONF_TEAMS = {
    'NCHC': ['arizona state', 'colorado college', 'denver', 'miami', 'minnesota duluth', 'north dakota', 'omaha', 'st cloud state', 'st thomas', 'western michigan'],
    'Big Ten': ['michigan', 'michigan state', 'minnesota', 'notre dame', 'ohio state', 'penn state', 'wisconsin'],
    'Hockey East': ['boston college', 'boston university', 'connecticut', 'maine', 'massachusetts', 'massachusetts lowell', 'merrimack', 'new hampshire', 'northeastern', 'providence', 'vermont'],
    'ECAC Hockey': ['brown', 'clarkson', 'colgate', 'cornell', 'dartmouth', 'harvard', 'princeton', 'quinnipiac', 'rensselaer', 'st lawrence', 'union', 'yale'],
    'CCHA': ['augustana', 'bemidji state', 'bowling green', 'ferris state', 'lake superior state', 'michigan tech', 'minnesota state', 'northern michigan'],
    // 9 men's teams in 2026-27 (Mercyhurst dropped men's D-I; AIC left in 2025)
    'Atlantic Hockey America': ['air force', 'army', 'bentley', 'canisius', 'holy cross', 'niagara', 'rochester institute of technology', 'robert morris', 'sacred heart'],
    'Independent': ['alaska', 'alaska anchorage', 'lindenwood', 'long island', 'stonehill']
  };
  var TEAM_CONF = {};
  Object.keys(CONF_TEAMS).forEach(function (c) { CONF_TEAMS[c].forEach(function (k) { TEAM_CONF[k] = c; }); });
  function canonConf(n) {
    var k = String(n || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!k) return '';
    if (k.indexOf('nchc') >= 0 || k.indexOf('nationalcollegiate') >= 0) return 'NCHC';
    if (k.indexOf('bigten') === 0 || k === 'big10' || k === 'b1g') return 'Big Ten';
    if (k.indexOf('hockeyeast') >= 0) return 'Hockey East';
    if (k.indexOf('ecac') >= 0) return 'ECAC Hockey';

      var el = document.getElementById('srcTxt');
      if (el) el.textContent = (DEMO ? 'DEMO DATA' : 'Source: NCAA') + (state.at ? ' · updated ' + ago(state.at) : '');
    }
    function load() {
      // a short stagger keeps us under the data source's burst limit
      var paths = ['/game/' + id + '/scoring-summary', '/game/' + id + '/boxscore', '/game/' + id + '/team-stats', '/game/' + id + '/play-by-play'];
      var jobs = paths.map(function (p, i) { return new Promise(function (res) { setTimeout(res, i * 250); }).then(function () { return api(p); }); });
      jobs.push(state.g && state.g.date ? api(sbPath(state.g.date)) : Promise.reject(new Error('no date')));
      Promise.allSettled(jobs).then(function (r) {
        if (r[4].status === 'fulfilled') {
          var list = (r[4].value.data && r[4].value.data.games) || [];
          list.map(normGame).forEach(function (g) { if (g.id === id) { g.date = state.g.date; state.g = g; gameCache[id] = g; } });
        }
        state.raw = {};
        if (r[0].status === 'fulfilled') { state.raw['scoring-summary'] = r[0].value.data; state.scoring = normScoring(r[0].value.data, state.g); state.at = r[0].value.at; }
        if (r[1].status === 'fulfilled') { state.raw.boxscore = r[1].value.data; state.box = normBox(r[1].value.data); state.at = state.at || r[1].value.at; }
        var tsRaw = r[2].status === 'fulfilled' ? r[2].value.data : null;
        if (tsRaw) state.raw['team-stats'] = tsRaw;
        state.ts = teamStatRows(state.box, tsRaw);
        if (r[3].status === 'fulfilled') { state.raw['play-by-play'] = r[3].value.data; state.plays = normPlays(r[3].value.data); }
        // header fallback when opened from a link (no scoreboard in memory)
        if (!state.g && r[1].status === 'fulfilled') {
          var bx = r[1].value.data, tm = (bx && bx.teams) || [];
          var hh = tm.filter(function (t) { return t.isHome; })[0], aa = tm.filter(function (t) { return !t.isHome; })[0];
          var tsb = (bx && bx.teamBoxscore) || [];
          function sc(t) {
            var x = tsb.filter(function (b) { return String(b.teamId) === String(t.teamId); })[0];
            if (x && x.teamStats && x.teamStats.goals != null && x.teamStats.goals !== '') return x.teamStats.goals;
            if (x && Array.isArray(x.playerStats) && x.playerStats.length) return x.playerStats.reduce(function (n, p) { return n + (+p.goals || 0); }, 0);
            return '';
          }
          if (hh && aa) {
            var mk = function (t) { var k = canon(t.nameShort); return { key: k, seo: t.seoname, name: t.nameShort, abbr: t.name6Char, score: String(sc(t)), feedRank: '', winner: false }; };
            state.g = { id: id, kind: String(bx.status).toUpperCase() === 'F' ? 'final' : 'live', away: mk(aa), home: mk(hh), s1: String(bx.period || ''), s2: '', conf: '', epoch: 0 };
            var A = +state.g.away.score, H = +state.g.home.score; if (state.g.kind === 'final') { state.g.away.winner = A > H; state.g.home.winner = H > A; }
          }
        }
        paint();
        var live = state.g ? state.g.kind === 'live' : true;
        if (live) later(load, CFG.gamePoll);
      });
    }
    ageTimer = setInterval(srcLine, 5000);
    current = { reload: load, repaint: paint };
    paint(); load();
  }
